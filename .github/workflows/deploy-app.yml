name: Deploy app

on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/migrations/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Construire l'interface
        run: |
          npm ci
          npm run build

      - name: Préparer SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H vps126758.serveur-vps.net >> ~/.ssh/known_hosts 2>/dev/null

      - name: Déployer l'interface (dist)
        run: rsync -az --delete dist/ "root@vps126758.serveur-vps.net:/opt/horizon/dist/"

      - name: Mettre à jour le code, les variables et redémarrer
        # Les cles viennent des secrets GitHub (Settings > Secrets and variables > Actions).
        # Une variable laissee vide n'est PAS ecrite : le .env existant est preserve.
        env:
          HORIZON_ADMIN_TOKEN: ${{ secrets.HORIZON_ADMIN_TOKEN }}
          # Un secret par fournisseur (nommage : HORIZON_<FOURNISSEUR>_API_KEY).
          # Chaque fiche fournisseur declare le nom de variable qu'elle utilise.
          HORIZON_GEMINI_API_KEY: ${{ secrets.HORIZON_GEMINI_API_KEY }}
          HORIZON_LLM_API_KEY: ${{ secrets.HORIZON_LLM_API_KEY }}
          HORIZON_OWNER_EMAIL: ${{ secrets.HORIZON_OWNER_EMAIL }}
          HORIZON_CORS_ORIGINS: ${{ secrets.HORIZON_CORS_ORIGINS }}
          HORIZON_GOOGLE_CLIENT_ID: ${{ secrets.HORIZON_GOOGLE_CLIENT_ID }}
          HORIZON_GOOGLE_CLIENT_SECRET: ${{ secrets.HORIZON_GOOGLE_CLIENT_SECRET }}
          HORIZON_GOOGLE_REDIRECT_URI: ${{ secrets.HORIZON_GOOGLE_REDIRECT_URI }}
          HORIZON_META_APP_ID: ${{ secrets.HORIZON_META_APP_ID }}
          HORIZON_META_APP_SECRET: ${{ secrets.HORIZON_META_APP_SECRET }}
          HORIZON_TIKTOK_CLIENT_KEY: ${{ secrets.HORIZON_TIKTOK_CLIENT_KEY }}
          HORIZON_TIKTOK_CLIENT_SECRET: ${{ secrets.HORIZON_TIKTOK_CLIENT_SECRET }}
          # Paiement (validation humaine obligatoire avant execution).
          HORIZON_STRIPE_SECRET_KEY: ${{ secrets.HORIZON_STRIPE_SECRET_KEY }}
          # Generation d'images (service compatible /images/generations).
          HORIZON_IMAGE_BASE_URL: ${{ secrets.HORIZON_IMAGE_BASE_URL }}
          HORIZON_IMAGE_API_KEY: ${{ secrets.HORIZON_IMAGE_API_KEY }}
          HORIZON_IMAGE_MODEL: ${{ secrets.HORIZON_IMAGE_MODEL }}
          # Synchronisation automatique : active le worker de fond (non sensible).
          HORIZON_SYNC_AUTO: "1"
        run: |
          PAYLOAD=$(python3 -c "import base64,json,os;keys=['HORIZON_ADMIN_TOKEN','HORIZON_LLM_API_KEY','HORIZON_GEMINI_API_KEY','HORIZON_OWNER_EMAIL','HORIZON_CORS_ORIGINS','HORIZON_GOOGLE_CLIENT_ID','HORIZON_GOOGLE_CLIENT_SECRET','HORIZON_GOOGLE_REDIRECT_URI','HORIZON_META_APP_ID','HORIZON_META_APP_SECRET','HORIZON_TIKTOK_CLIENT_KEY','HORIZON_TIKTOK_CLIENT_SECRET','HORIZON_STRIPE_SECRET_KEY','HORIZON_IMAGE_BASE_URL','HORIZON_IMAGE_API_KEY','HORIZON_IMAGE_MODEL','HORIZON_SYNC_AUTO'];print(base64.b64encode(json.dumps({k:os.environ.get(k,'') for k in keys}).encode()).decode())")
          ssh "root@vps126758.serveur-vps.net" \
            "cd /opt/horizon && git fetch origin main && git reset --hard origin/main && /opt/horizon/.venv/bin/pip install -q -r backend/requirements.txt && /opt/horizon/.venv/bin/python scripts/set_env.py backend/.env '$PAYLOAD' && systemctl restart horizon"

      - name: Verifier le service et tester les fournisseurs LLM
        # Verifie la sante du service puis teste chaque fournisseur LLM configure
        # (cle lue uniquement cote serveur : aucun secret n'est affiche ici).
        env:
          HORIZON_ADMIN_TOKEN: ${{ secrets.HORIZON_ADMIN_TOKEN }}
        run: |
          BASE="https://horizon.mayela-crm.com"
          for i in $(seq 1 20); do
            if curl -fsS "$BASE/api/v1/health" >/dev/null 2>&1; then break; fi
            sleep 3
          done
          echo "--- sante ---"
          curl -fsS "$BASE/api/v1/health" || echo "health indisponible"
          echo
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          base = "https://horizon.mayela-crm.com"
          token = os.environ.get("HORIZON_ADMIN_TOKEN", "").strip()
          if not token:
              print("HORIZON_ADMIN_TOKEN absent : test des fournisseurs ignore.")
              raise SystemExit(0)

          def call(path, method="GET"):
              req = urllib.request.Request(
                  base + path, method=method, headers={"X-Horizon-Token": token}
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  return json.loads(resp.read().decode() or "{}")

          try:
              providers = call("/api/v1/models").get("items", [])
          except Exception as exc:
              print("Lecture des fournisseurs impossible :", exc)
              raise SystemExit(0)

          if not providers:
              print("Aucun fournisseur LLM enregistre.")
              raise SystemExit(0)

          for provider in providers:
              name = provider.get("name") or provider.get("id")
              try:
                  result = call(f"/api/v1/models/{provider['id']}/test", method="POST")
                  print(f"{name} -> {result.get('status')} ({result.get('last_error') or 'ok'})")
              except urllib.error.HTTPError as exc:
                  print(f"{name} -> HTTP {exc.code} : {exc.read().decode()[:200]}")
              except Exception as exc:
                  print(f"{name} -> erreur : {exc}")

          # Test de bout en bout : un vrai appel au modele via l'API.
          available = [p for p in providers if p.get("status") == "available"]
          if not available:
              print("Aucun fournisseur disponible : test de chat ignore.")
              raise SystemExit(0)

          provider = available[0]
          body = json.dumps(
              {"provider_id": provider["id"], "message": "Reponds en une phrase : HORIZON est-il operationnel ?"}
          ).encode()
          request = urllib.request.Request(
              base + "/api/v1/models/chat-test",
              data=body,
              method="POST",
              headers={"X-Horizon-Token": token, "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as resp:
                  answer = json.loads(resp.read().decode() or "{}")
              content = str(answer.get("content") or "").strip().replace("\n", " ")
              print(f"chat-test ({provider.get('name')}) -> OK : {content[:400]}")
          except urllib.error.HTTPError as exc:
              print(f"chat-test -> HTTP {exc.code} : {exc.read().decode()[:300]}")
          except Exception as exc:
              print("chat-test -> erreur :", exc)
          PY

      - name: Verifier une mission de bout en bout
        # Declenchement manuel uniquement : cree une vraie mission en production.
        if: github.event_name == 'workflow_dispatch'
        env:
          HORIZON_ADMIN_TOKEN: ${{ secrets.HORIZON_ADMIN_TOKEN }}
        run: |
          python3 backend/tools/run_mission.py \
            --base-url "https://horizon.mayela-crm.com" \
            --project-id "project-default" \
            --title "Verification de deploiement" \
            --description "Mission de controle declenchee depuis le workflow de deploiement."

      - name: Verifier les outils payants (Stripe et images)
        # Controle honnete : on n'affiche jamais la valeur d'une cle, seulement sa
        # presence. Aucun paiement n'est cree (pas de confirm) et aucune image n'est
        # generee (facturation) : on verifie la cle chargee et le garde-fou.
        env:
          HORIZON_ADMIN_TOKEN: ${{ secrets.HORIZON_ADMIN_TOKEN }}
          HORIZON_STRIPE_SECRET_KEY: ${{ secrets.HORIZON_STRIPE_SECRET_KEY }}
          HORIZON_IMAGE_BASE_URL: ${{ secrets.HORIZON_IMAGE_BASE_URL }}
          HORIZON_IMAGE_API_KEY: ${{ secrets.HORIZON_IMAGE_API_KEY }}
          HORIZON_IMAGE_MODEL: ${{ secrets.HORIZON_IMAGE_MODEL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          base = "https://horizon.mayela-crm.com"
          token = os.environ.get("HORIZON_ADMIN_TOKEN", "").strip()

          def presence(name):
              return "presente" if os.environ.get(name, "").strip() else "ABSENTE"

          print("Stripe HORIZON_STRIPE_SECRET_KEY :", presence("HORIZON_STRIPE_SECRET_KEY"))
          print("Images HORIZON_IMAGE_BASE_URL    :", presence("HORIZON_IMAGE_BASE_URL"))
          print("Images HORIZON_IMAGE_API_KEY     :", presence("HORIZON_IMAGE_API_KEY"))
          print("Images HORIZON_IMAGE_MODEL       :", presence("HORIZON_IMAGE_MODEL"))

          if not token:
              print("HORIZON_ADMIN_TOKEN absent : controle des outils ignore.")
              raise SystemExit(0)

          def run_tool(tool_id, params):
              body = json.dumps({"params": params}).encode()
              req = urllib.request.Request(
                  base + f"/api/v1/tools/{tool_id}/run",
                  data=body, method="POST",
                  headers={"X-Horizon-Token": token, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read().decode() or "{}")

          # Paiement sans confirmation : aucun mouvement d'argent, on verifie que la
          # cle est chargee et que le garde-fou de validation humaine repond.
          # Un outil casse fait echouer le deploiement (voyant rouge explicite).
          echecs = []

          if presence("HORIZON_STRIPE_SECRET_KEY") == "ABSENTE":
              print("tool-payment -> ignore (cle Stripe absente)")
          else:
              try:
                  result = run_tool("tool-payment", {"amount": 1000, "currency": "eur"})
                  status = str((result.get("result") or {}).get("status") or "")
                  if status == "requires_human_validation":
                      print("tool-payment -> OK (garde-fou de validation humaine actif)")
                  else:
                      print("tool-payment -> INATTENDU :", status or result)
                      echecs.append("tool-payment")
              except urllib.error.HTTPError as exc:
                  print("tool-payment -> HTTP", exc.code, ":", exc.read().decode()[:300])
                  echecs.append("tool-payment")
              except Exception as exc:
                  print("tool-payment -> erreur :", exc)
                  echecs.append("tool-payment")

          # Images : generation reelle seulement si le fournisseur est gratuit
          # (Pollinations). Un fournisseur payant n'est pas appele (facturation).
          base_image = os.environ.get("HORIZON_IMAGE_BASE_URL", "").strip().lower()
          if not base_image:
              print("tool-image-generate -> ignore (aucun fournisseur d'images)")
          elif "pollinations" not in base_image:
              print("tool-image-generate -> non appele (fournisseur payant, pas de frais en CI)")
          else:
              try:
                  result = run_tool(
                      "tool-image-generate",
                      {"prompt": "un phare au coucher du soleil", "size": "512x512"},
                  )
                  images = (result.get("result") or {}).get("images") or []
                  if images:
                      print("tool-image-generate -> OK :", str(images[0])[:120])
                      # Verification reelle : l'URL doit servir une image.
                      try:
                          with urllib.request.urlopen(images[0], timeout=120) as resp:
                              kind = resp.headers.get("Content-Type", "")
                              taille = len(resp.read())
                          print(f"image servie -> HTTP 200, {kind}, {taille} octets")
                          if taille < 1000:
                              echecs.append("tool-image-generate (image vide)")
                      except Exception as exc:
                          print("image servie -> erreur :", exc)
                          echecs.append("tool-image-generate (URL injoignable)")
                  else:
                      print("tool-image-generate -> INATTENDU :", result)
                      echecs.append("tool-image-generate")
              except urllib.error.HTTPError as exc:
                  print("tool-image-generate -> HTTP", exc.code, ":", exc.read().decode()[:300])
                  echecs.append("tool-image-generate")
              except Exception as exc:
                  print("tool-image-generate -> erreur :", exc)
                  echecs.append("tool-image-generate")

          if echecs:
              print("ECHEC des outils :", ", ".join(echecs))
              raise SystemExit(1)
          print("Outils payants : verification terminee.")
          PY
